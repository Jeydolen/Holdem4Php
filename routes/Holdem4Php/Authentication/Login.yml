info:
  name: Login
  type: http
  seq: 2

http:
  method: POST
  url: "{{base_url}}/authentication/login"
  headers:
    - name: X-Client-Type
      value: api
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "username": "Jey",
        "password": "123456"
      }
  auth: inherit

runtime:
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.access_token
        method: jsonq
      variable:
        name: access_token
        scope: runtime
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.refresh_token
        method: jsonq
      variable:
        name: refresh_token
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
