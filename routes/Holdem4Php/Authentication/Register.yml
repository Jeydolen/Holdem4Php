info:
  name: Register
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/authentication/register"
  headers:
    - name: X-Client-Type
      value: api
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "username": "test",
        "password": "test"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
