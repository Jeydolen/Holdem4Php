info:
  name: Refresh
  type: http
  seq: 3

http:
  method: POST
  url: "{{base_url}}/authentication/refresh"
  headers:
    - name: X-Client-Type
      value: api
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: ""
  auth:
    type: bearer
    token: "{{refresh_token}}"

runtime:
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.access_token
        method: jsonq
      variable:
        name: access_token
        scope: runtime
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.refresh_token
        method: jsonq
      variable:
        name: refresh_token
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
